<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧾 Gerador de Recibo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>🧾 Gerador de Recibo</h1>
        <form id="formRecibo" class="form-grid">
            <!-- Cabeçalho -->
            <div class="form-group">
                <label for="numRecibo">Nº do Recibo *</label>
                <input type="text" id="numRecibo" value="002/2026" required />
            </div>
            <div class="form-group">
                <label for="dataRecibo">Data do Recibo *</label>
                <input type="date" id="dataRecibo" required />
            </div>
            <div class="form-group full-width">
                <label for="locador">Locador *</label>
                <input type="text" id="locador" placeholder="Nome do locador" required />
            </div>
            <div class="form-group full-width">
                <label for="locatario">Locatário *</label>
                <input type="text" id="locatario" placeholder="Nome do locatário" required />
            </div>
            <div class="form-group full-width">
                <label for="imovel">Imóvel *</label>
                <input type="text" id="imovel" value="Ponto Comercial nº 02 — Rua Leblon, 531, Centro — CEP 69.112-000 — Novo Remanso — AM" required />
            </div>

            <!-- Valores -->
            <div class="form-group">
                <label for="valorAluguel">Valor do Aluguel (R$) *</label>
                <input type="number" id="valorAluguel" value="500.00" step="0.01" min="0" required />
            </div>
            <div class="form-group">
                <label for="diaVencimento">Vencimento (dia) *</label>
                <input type="number" id="diaVencimento" value="19" min="1" max="31" required />
            </div>

            <!-- Luz -->
            <div class="form-group">
                <label for="medidor">Nº do Medidor *</label>
                <input type="text" id="medidor" value="002" required />
            </div>
            <div class="form-group">
                <label for="tarifa">Tarifa (R$/kWh) *</label>
                <input type="number" id="tarifa" value="0.875710" step="0.000001" required />
            </div>
            <div class="form-group">
                <label for="leituraAnterior">Leitura Anterior (kWh) *</label>
                <input type="number" id="leituraAnterior" value="0" step="1" min="0" required />
            </div>
            <div class="form-group">
                <label for="leituraAtual">Leitura Atual (kWh) *</label>
                <input type="number" id="leituraAtual" value="0" step="1" min="0" required />
            </div>
            <div class="form-group">
                <label for="valorLuz">Valor da Luz (R$)</label>
                <input type="number" id="valorLuz" readonly placeholder="calcula sozinho" />
            </div>

            <!-- Saldo Pendente -->
            <div class="form-group full-width">
                <label>🔴 Saldo Pendente a Pagar (R$) *</label>
                <input type="number" id="saldoPendente" step="0.01" min="0" placeholder="Digite o valor" required />
                <small style="color: #666; font-style: italic; margin-top: 4px; display: block;">
                    Obs: Referente à conta de luz do mês anterior
                </small>
            </div>

            <!-- Período -->
            <div class="form-group">
                <label for="periodoInicio">Período — De *</label>
                <input type="date" id="periodoInicio" required />
            </div>
            <div class="form-group">
                <label for="periodoFim">Período — Até *</label>
                <input type="date" id="periodoFim" required />
            </div>

            <!-- Forma de Pagamento -->
            <div class="form-group full-width">
                <label>Forma de Pagamento</label>
                <div style="display: flex; gap: 25px; flex-wrap: wrap; padding: 8px 0;">
                    <label style="font-size: 1rem; cursor: pointer;"><input type="checkbox" id="pagDinheiro" /> Dinheiro</label>
                    <label style="font-size: 1rem; cursor: pointer;"><input type="checkbox" id="pagPix" /> Pix</label>
                    <label style="font-size: 1rem; cursor: pointer;"><input type="checkbox" id="pagTransferencia" /> Transferência</label>
                </div>
            </div>

            <div class="form-group">
                <label for="cidade">Cidade *</label>
                <input type="text" id="cidade" value="Novo Remanso" required />
            </div>
            <div class="form-group">
                <label for="dataAssinatura">Data de Assinatura *</label>
                <input type="date" id="dataAssinatura" required />
            </div>

            <button type="button" class="btn-gerar" id="btnGerar">📄 Gerar Recibo</button>
        </form>

        <p style="margin-top: 15px; font-size: 0.95rem; color: #555; text-align: center;">
            * Campos obrigatórios. Preencha todos e clique em "Gerar Recibo".
        </p>

        <div class="recibo-area" id="reciboArea">
            <div class="recibo-wrapper">
                <div class="recibo" id="reciboContent"></div>
            </div>
            <div class="btn-group">
                <button class="btn-imprimir" id="btnImprimir">🖨️ Imprimir</button>
                <button class="btn-baixar" id="btnBaixarPDF">⬇️ Baixar PDF</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
